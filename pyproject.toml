[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nighthawk"
version = "1.0.0"
description = "Ethical red-team reconnaissance, attack-surface discovery, and exposure-assessment platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
]
dependencies = [
    # Core framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database
    "sqlalchemy>=2.0.35",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.9",
    "sqlite-utils>=3.3",
    # Async networking
    "httpx>=0.27.0",
    "httpcore>=1.0.5",
    "dnspython>=2.6.1",
    "scapy>=2.5.0",
    "aiofiles>=24.1.0",
    # CLI / UX
    "typer>=0.12.5",
    "rich>=13.9.0",
    "click>=8.1.7",
    # Graph / Analysis
    "networkx>=3.4",
    "pandas>=2.2.3",
    # Template / Reporting
    "jinja2>=3.1.4",
    "weasyprint>=63.0",
    "markdown>=3.7",
    # Cryptography / Cert parsing
    "cryptography>=43.0.0",
    # Git integration
    "gitpython>=3.1.43",
    # Data / Config
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    # Logging / Telemetry
    "structlog>=24.4.0",
    # Utilities
    "python-dateutil>=2.9.0",
    "ipaddress>=1.0.23",
    "tqdm>=4.66.5",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
    "types-python-dateutil>=2.9.0",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.32.0",
    "build>=1.2.0",
    "twine>=5.1.0",
    "types-pytz>=2024.0",
]
frontend = [
    "nodeenv>=1.9.0",
]

[project.scripts]
nighthawk = "nighthawk.cli.main:app"

[project.urls]
Homepage = "https://github.com/Xenoz-GitHub/NightHawk"
Documentation = "https://github.com/Xenoz-GitHub/NightHawk/docs"
Repository = "https://github.com/Xenoz-GitHub/NightHawk"
Issues = "https://github.com/Xenoz-GitHub/NightHawk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/nighthawk"]
include = [
    "src/nighthawk/data",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/templates",
    "/fingerprints",
    "/rules",
    "/docs",
    "/frontend",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".mypy_cache",
    ".venv",
    ".env",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM", "A"]
ignore = ["D100", "D104", "D203", "D213", "D401", "D406", "D407", "D412"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["nighthawk"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -ra --import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["src/nighthawk"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
